name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No windows: the runner needs a pty, and there is none there.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      # The integration tests need a real ansible; installing it is cheap
      # next to what they check, which is that pave's idea of an inventory
      # and of a playbook run matches ansible's.
      - name: Install ansible
        if: runner.os == 'Linux'
        run: pipx install --include-deps ansible-core

      - name: Integration tests
        if: runner.os == 'Linux'
        env:
          PAVE_IT: '1'
        run: go test -count=1 ./...

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          COMMIT="$(git rev-parse --short HEAD)"
          PKG=github.com/mnorrsken/pave
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target##*/}"
            out="dist/pave_${VERSION_NO_V}_${os}_${arch}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X ${PKG}/internal/version.Version=${VERSION} -X ${PKG}/internal/version.Commit=${COMMIT}" \
                -o "$out" ./cmd/pave
          done

      - name: Compute sha256 checksums
        working-directory: dist
        run: |
          sha256sum pave_* > checksums.txt
          cat checksums.txt

      - name: Extract the changelog section for this release
        run: |
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"
          # Everything between this version's heading and the next one.
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            echo "No CHANGELOG section for ${VERSION_NO_V}" >&2
            exit 1
          fi
          cat notes-body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${GITHUB_REF#refs/tags/v}"

          {
            cat notes-body.md
            cat <<NOTES

          ## Install

          \`\`\`sh
          go install github.com/mnorrsken/pave/cmd/pave@${VERSION}
          \`\`\`

          On linux or macOS, download the matching binary below and put it where
          \`make install\` would:

          \`\`\`sh
          sudo install -m 0755 pave_${VERSION_NO_V}_\$(uname -s | tr 'A-Z' 'a-z')_\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') /usr/local/bin/pave
          \`\`\`

          Verify with \`sha256sum -c checksums.txt --ignore-missing\` — checksums attached below.
          NOTES
          } > notes.md

          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file notes.md \
            dist/pave_* dist/checksums.txt

---
# The containers `make lab-up` starts. They are all the same machine; the
# groups exist so there is something to pick in the host picker and something
# for a limit to mean.
all:
  children:
    web:
      hosts:
        web1:
          ansible_port: 2221
        web2:
          ansible_port: 2222
    db:
      hosts:
        db1:
          ansible_port: 2223
    edge:
      hosts:
        edge1:
          ansible_port: 2224

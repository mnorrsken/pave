---
# Nothing here needs the network, so it runs the same on a machine that has
# never seen one, and it is meant to come back green on the second run.

- name: The lab group exists
  ansible.builtin.group:
    name: "{{ baseline_group }}"
    state: present

- name: The lab users exist
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ baseline_group }}"
    append: true
    shell: /bin/bash
    state: present
  loop: "{{ baseline_users }}"

- name: The lab directory exists
  ansible.builtin.file:
    path: "{{ baseline_dir }}"
    state: directory
    owner: root
    group: "{{ baseline_group }}"
    mode: "0775"

- name: The motd says who owns the machine
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

- name: The lab settings are in one place
  ansible.builtin.template:
    src: lab.conf.j2
    dest: "{{ baseline_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Stamp the config

- name: X11 forwarding is off
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*X11Forwarding'
    line: "X11Forwarding no"
    validate: "/usr/sbin/sshd -t -f %s"
  # A real host would notify a handler that restarts sshd. There is no init
  # system in the container, so this one only writes the file.

# Not /etc/hosts: inside a container that is a bind mount, and no module can
# rename a new file over it.
- name: The lab hosts file knows the other machines
  ansible.builtin.blockinfile:
    path: "{{ baseline_hosts }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} lab"
    block: |
      {% for host in groups['all'] | sort %}
      127.0.0.1 {{ host }}
      {% endfor %}

- name: The stamp is where it should be
  ansible.builtin.stat:
    path: "{{ baseline_dir }}/stamp"
  register: stamp

- name: Say whether this host has been through here before
  ansible.builtin.debug:
    msg: >-
      {{ 'first run'
         if not stamp.stat.exists
         else 'last stamped ' ~ ('%Y-%m-%d %H:%M:%S' | strftime(stamp.stat.mtime)) }}

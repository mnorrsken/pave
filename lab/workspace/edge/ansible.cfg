[defaults]
inventory = ../inventory/hosts.yml
roles_path = roles
# Lab only: the containers make new host keys every time they start, so there
# is nothing stable to check and nothing worth writing into a known_hosts.
host_key_checking = False
interpreter_python = /usr/bin/python3

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True

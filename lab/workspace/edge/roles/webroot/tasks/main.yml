---
- name: The web root exists
  ansible.builtin.file:
    path: "{{ webroot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [content]

- name: The pages are written
  ansible.builtin.template:
    src: page.html.j2
    dest: "{{ webroot_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ webroot_pages }}"
  tags: [content]

- name: Nothing crawls the lab
  ansible.builtin.copy:
    src: robots.txt
    dest: "{{ webroot_dir }}/robots.txt"
    owner: root
    group: root
    mode: "0644"
  tags: [content]

- name: Every page arrived
  ansible.builtin.stat:
    path: "{{ webroot_dir }}/{{ item }}"
  loop: "{{ webroot_pages }}"
  register: pages
  tags: [check]

- name: None of them is empty
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.size > 0
    fail_msg: "{{ item.item }} is missing or empty"
    quiet: true
  loop: "{{ pages.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [check]

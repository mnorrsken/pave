# pave's settings. Copy to ~/.config/pave/config.yaml and edit; every key is
# optional. A .pave.yaml in the root being browsed overrides what is here.

# Where to look for ansible projects. The -root flag and $PAVE_ROOT win over
# this, and with none of them set pave scans the current directory.
root: ~/dev/projects/ansible-restructure/workspace

# Preselected by the o key, relative to the root. Leave it out to pick the
# playbook yourself.
onboard_playbook: base/playbooks/onboard.yml

# The command a run executes. Point it at a wrapper script to run playbooks in
# a container.
ansible_playbook_bin: ansible-playbook
ansible_inventory_bin: ansible-inventory

# Added to the environment of every run and of every inventory read.
env:
  SOPS_AGE_KEY_FILE: ~/.config/sops/age/keys.txt

# What the c key signs.
ssh_cert:
  ca_key: ~/ssh-ca/user_ca
  key: ~/.ssh/id_ed25519
  validity: +12h
  principals: [ansible-admin, pi, martin, root, dietpi, admin]
  # identity: martin@laptop     # defaults to <user>@<host>
  add_to_agent: true

# What a newly opened playbook starts with. Check mode is not here: it is
# answered in the confirmation the run button opens.
defaults:
  diff: true       # on unless you say otherwise
  verbose: false   # whether the verbosity checkbox starts ticked
  verbosity: 1     # how many v's that checkbox is worth, 1 to 4

# What the inventory browser opens a file with. A command line, not just a
# name. Left out: $VISUAL, then $EDITOR, then vi.
# editor: nvim

# Only if the defaults do not fit your tree.
# playbook_dirs: [playbooks, playbook]
# exclude: [.git, .galaxy, node_modules, venv, .venv, roles, collections, group_vars, host_vars, files, templates]
